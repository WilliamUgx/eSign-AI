<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>eSign AI Avatar</title>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;
            background: transparent;

            font-family: Arial, Helvetica, sans-serif;
        }

        #avatar-container {
            position: relative;

            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at center,
                    rgba(65, 65, 65, 0.95),
                    rgba(20, 20, 20, 0.98)
                );
        }

        #avatar-stage {
            position: relative;

            width: 100%;
            flex: 1;

            min-height: 0;
            overflow: hidden;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;

            display: block;

            outline: none;
        }

        #loading-message {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 90%;

            color: #ffffff;

            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
            text-align: center;

            pointer-events: none;
        }

        #loading-message.error {
            color: #ffb3b3;
        }

        #signText {
            min-height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 8px 12px;

            background: rgba(0, 0, 0, 0.78);
            border-top: 1px solid rgba(255, 255, 255, 0.12);

            color: #ffffff;

            font-size: 14px;
            font-weight: 700;
            line-height: 1.3;
            text-align: center;

            word-break: break-word;
        }
    </style>
</head>

<body>
    <main
        id="avatar-container"
        aria-label="eSign AI sign-language avatar"
    >
        <section id="avatar-stage">
            <canvas
                id="renderCanvas"
                aria-label="Three-dimensional sign-language avatar"
            ></canvas>

            <div
                id="loading-message"
                role="status"
                aria-live="polite"
            >
                Preparing avatar...
            </div>
        </section>

        <div
            id="signText"
            aria-live="polite"
        >
            Waiting for captions...
        </div>
    </main>

    <!-- Three.js must load first. -->
    <script src="libs/three.min.js"></script>

    <!-- GLTFLoader depends on Three.js. -->
    <script src="libs/GLTFLoader.js"></script>

    <!-- Our avatar engine loads last. -->
    <script src="avatar.js"></script>
    <script src="messageBus.js"></script>
</body>
</html>
